name: AccuKnox Secret Scan Workflow
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          
      - name: Run Secret Scan
        uses: accuknox/secret-scan-action@main
        with:
          additional_arguments: "--debug --no-verification"   # --no-verification reports unverified hits too
          upload_results: true
          accuknox_token: ${{ secrets.ACCUKNOX_TOKEN }}
          accuknox_endpoint: ${{ secrets.ACCUKNOX_ENDPOINT }}
          accuknox_label: gitleaktest
          soft_fail: true
