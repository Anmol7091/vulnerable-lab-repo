name: AccuKnox Secret Scan
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Direct TruffleHog check
        id: direct
        continue-on-error: true
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          docker run --rm -v "$PWD:/repo" trufflesecurity/trufflehog:latest \
            git file:///repo --no-update \
            --results=verified,unknown,unverified,filtered_unverified \
            --json > direct-trufflehog.json || true
          COUNT=$(grep -c '"DetectorName"' direct-trufflehog.json || true)
          echo "count=${COUNT:-0}" >> "$GITHUB_OUTPUT"
      - name: Run AccuKnox Secret Scan
        id: accuknox
        continue-on-error: true
        uses: accuknox/secret-scan-action@latest
        with:
          additional_arguments: "--debug"
          upload_results: true
          accuknox_token: ${{ secrets.ACCUKNOX_TOKEN }}
          accuknox_endpoint: ${{ secrets.ACCUKNOX_ENDPOINT }}
          accuknox_label: gitleaktest
          soft_fail: true
      - name: Secret count summary
        if: always()
        run: |
          DIRECT="${{ steps.direct.outputs.count }}"
          if [ -f results-secret.jsonl ]; then
            ACCU=$(grep -c '"DetectorName"' results-secret.jsonl || true)
            ACCU_LINES=$(wc -l < results-secret.jsonl)
          else
            ACCU="n/a (results file not created)"
            ACCU_LINES="n/a"
          fi
          {
            echo "## Secret scan results"
            echo "| Scanner | Secrets found |"
            echo "|---|---|"
            echo "| Direct TruffleHog | ${DIRECT:-0} |"
            echo "| AccuKnox action | ${ACCU:-0} (lines in file: $ACCU_LINES) |"
            echo "| AccuKnox step outcome | ${{ steps.accuknox.outcome }} |"
          } | tee -a "$GITHUB_STEP_SUMMARY"CCUKNOX_ENDPOINT }}
          accuknox_label: gitleaktest
          soft_fail: true
